<h1>不要一直重複同一個錯誤</h1>
<p>核心只有一句：<b>做事的人不能自己打分數</b>。一個人做，另一個人檢查。兩邊分開。</p>
<div class="step"><b>第 1 步｜切小塊</b>：一次只做一件事，不要把好幾件綁在一起。</div>
<div class="step"><b>第 2 步｜分工</b>：把小工作交給不同的 AI，各自做擅長的。</div>
<div class="step"><b>第 3 步｜拿掉重複</b>：新做出來的先跟已有的比對，重複的就不要。</div>
<div class="step"><b>第 4 步｜用程式驗收</b>：AI 說「做好了」不算數，用固定的檢查程式確認。</div>
<div class="step"><b>第 5 步｜換別人檢查</b>：另找一個沒看過先前對話的人或 AI 挑毛病，通過才算完成。</div>
<div class="step"><b>第 6 步｜停下來</b>：連續兩次都沒進步，就停下來換方法，不要一直重試。</div>
</div>
